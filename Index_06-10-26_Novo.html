<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {useState,useMemo,useEffect,useRef} = React;
const {createRoot} = ReactDOM;

const KEY = "controle_operacional";
const DRIVE_FILE = "dados.json";
const BTN_AZUL = "bg-[#1e4a8a] hover:bg-[#255aa8] text-white px-3 py-2 rounded font-semibold text-[12px] cursor-pointer";
const VAZIO = "__VAZIO__";
const campoLbl = "text-[11px] font-bold uppercase";
const campoIn = "w-full border rounded px-3 py-2.5 mt-1 text-[14px]";
const STATUS_OPC = ["PAGO D","PAGO C","PENDENTE",""];
function casa(arr,v){ return arr.includes(v) || (arr.includes(VAZIO) && String(v??"").trim()===""); }
function parseNum(v){ const s=String(v).trim(); if(s==="") return 0; return s.includes(",") ? Number(s.replace(/\./g,"").replace(",",".")) : Number(s); }

// Utils
function toISO(d){ if(!d) return new Date().toISOString(); if(d.includes("T")) return d; return `${d}T00:00:00`; }
function diaSemana(d){ try{ return new Intl.DateTimeFormat("pt-BR",{weekday:"long"}).format(new Date(toISO(d))); }catch{return "";} }
function mesAno(d){ try{ return new Intl.DateTimeFormat("pt-BR",{month:"long",year:"numeric"}).format(new Date(toISO(d))).replace(" de ","/"); }catch{return "";} }
function fmtBR(d){ try{ return new Date(toISO(d)).toLocaleDateString("pt-BR"); }catch{return d;} }
function fmtM(v){ return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function newId(){ return `${Date.now()}_${Math.random().toString(36).slice(2,8)}`; }

// Aviso na caixa do topo (ok / info / erro)
function aviso(txt,tipo){
  const el=document.getElementById("fb"); if(!el) return;
  const cor={ok:"bg-emerald-50 border-emerald-200 text-emerald-800",info:"bg-blue-50 border-blue-200 text-blue-800",erro:"bg-rose-50 border-rose-200 text-rose-800"}[tipo]||"";
  el.textContent=txt; el.className="block border px-3 py-2 rounded text-[12px] mb-3 "+cor;
  clearTimeout(window.__avT); window.__avT=setTimeout(()=>{el.className="hidden"},tipo==="erro"?8000:4000);
}

function normaliza(l){
  const data = toISO(l.data);
  const cd = Number(l.cd ?? 0);
  const cont = (l.container||"").trim().toUpperCase();
  const credito = cd>0?cd:0;
  const debitos = cd<0?cd:0;
  return {
    id: l.id || newId(),
    descricao: (l.descricao||"").toUpperCase(),
    parc: String(l.parc||"0"),
    viagem: (l.viagem||"DINHEIRO").toUpperCase(),
    container: cont,
    data,
    cd,
    status: (l.status||"").toUpperCase(),
    dia: diaSemana(data),
    mes: mesAno(data),
    credito, debitos, saldo: credito+debitos
  };
}

// ===== Ordenação =====
const COLS_ORD = [["descricao","Descrição"],["parc","Parc"],["viagem","Viagem"],["container","Container"],["data","Data"],["cd","CD"],["status","Status"],["mes","Mês"],["saldo","Saldo"]];
const ORD_PADRAO = [{col:"data",dir:"desc"}];
const COLS_NUM = new Set(["cd","saldo"]);
function cmpCol(x,y,col){
  if(col==="data"||col==="mes") return new Date(x.data)-new Date(y.data);
  if(col==="parc") return (parseInt(x.parc)||0)-(parseInt(y.parc)||0);
  if(COLS_NUM.has(col)) return (Number(x[col])||0)-(Number(y[col])||0);
  return String(x[col]??"").localeCompare(String(y[col]??""),"pt-BR");
}
function resumoOrd(sc){
  return sc.map(s=>{ const n=(COLS_ORD.find(c=>c[0]===s.col)||[])[1]||s.col; return n+(s.dir==="asc"?" ↑":" ↓"); }).join(" › ");
}

// ===== Filtro com seleção múltipla =====
function useFora(ref,fechar){
  useEffect(()=>{
    function h(e){ if(ref.current && !ref.current.contains(e.target)) fechar(); }
    document.addEventListener("mousedown",h); document.addEventListener("touchstart",h);
    return ()=>{ document.removeEventListener("mousedown",h); document.removeEventListener("touchstart",h); };
  },[]);
}

function MultiSelect({label,options:base,value,onChange,vazio=true}){
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState("");
  const ref=useRef(null);
  useFora(ref,()=>setOpen(false));
  const options=vazio?[{value:VAZIO,label:"(Vazios)"},...base]:base;
  const vis=options.filter(o=>o.label.toLowerCase().includes(q.toLowerCase()));
  const toggle=v=>onChange(value.includes(v)?value.filter(x=>x!==v):[...value,v]);
  const achou=v=>(options.find(o=>o.value===v)||{}).label ?? v;
  const txt = value.length===0 ? `TODOS - ${label}` : value.length===1 ? `${label}: ${achou(value[0])}` : `${label}: ${value.length} selecionados`;
  return React.createElement("div",{ref,className:"relative"},
    React.createElement("button",{type:"button",onClick:()=>setOpen(!open),className:`w-full border rounded px-2 py-1.5 text-[12px] bg-white flex items-center justify-between gap-2 text-left ${value.length?"border-[#1e4a8a] bg-blue-50 font-semibold":""}`},
      React.createElement("span",{className:"truncate"},txt),
      React.createElement("span",{className:"text-[9px]"},open?"▲":"▼")
    ),
    open && React.createElement("div",{className:"absolute z-40 mt-1 left-0 min-w-full w-[260px] max-w-[85vw] bg-white border rounded shadow-lg"},
      React.createElement("div",{className:"p-2 border-b flex flex-col gap-2"},
        React.createElement("input",{value:q,onChange:e=>setQ(e.target.value),placeholder:"Buscar...",className:"w-full border rounded px-2 py-1 text-[12px]"}),
        React.createElement("div",{className:"flex gap-2"},
          React.createElement("button",{type:"button",onClick:()=>onChange([...new Set([...value,...vis.map(o=>o.value)])]),className:"text-[11px] text-[#1e4a8a] font-semibold"},"Marcar visíveis"),
          React.createElement("button",{type:"button",onClick:()=>onChange([]),className:"text-[11px] text-rose-600 font-semibold"},"Limpar")
        )
      ),
      React.createElement("div",{className:"max-h-60 overflow-auto"},
        vis.length===0 && React.createElement("div",{className:"p-3 text-[11px] text-slate-400"},"Nada encontrado"),
        vis.map(o=>React.createElement("label",{key:o.value===""?"__vazio":o.value,className:"flex items-center gap-2 px-3 py-1.5 text-[12px] hover:bg-slate-50 cursor-pointer"},
          React.createElement("input",{type:"checkbox",checked:value.includes(o.value),onChange:()=>toggle(o.value)}),
          React.createElement("span",null,o.label)
        ))
      )
    )
  );
}

// ===== Painel de ordenação =====
function SortPanel({sortCols,setSortCols}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useFora(ref,()=>setOpen(false));
  const toggleCol=col=>{
    if(sortCols.some(s=>s.col===col)) setSortCols(sortCols.filter(s=>s.col!==col));
    else setSortCols([...sortCols,{col,dir:"asc"}]);
  };
  const inverte=col=>setSortCols(sortCols.map(s=>s.col===col?{...s,dir:s.dir==="asc"?"desc":"asc"}:s));
  return React.createElement("div",{ref,className:"relative"},
    React.createElement("button",{type:"button",onClick:()=>setOpen(!open),className:BTN_AZUL+" !py-1.5"},`⇅ Ordenar (${sortCols.length})`),
    open && React.createElement("div",{className:"absolute z-40 mt-1 right-0 w-[300px] max-w-[85vw] bg-white border rounded shadow-lg"},
      React.createElement("div",{className:"p-2 border-b text-[11px] text-slate-500"},"Marque as colunas na ordem de prioridade e escolha crescente ou decrescente."),
      React.createElement("div",{className:"max-h-72 overflow-auto"},
        COLS_ORD.map(([col,nome])=>{
          const idx=sortCols.findIndex(s=>s.col===col); const ativo=idx>=0;
          return React.createElement("div",{key:col,className:"flex items-center gap-2 px-3 py-1.5 text-[12px] hover:bg-slate-50"},
            React.createElement("input",{type:"checkbox",checked:ativo,onChange:()=>toggleCol(col)}),
            React.createElement("span",{className:"flex-1 cursor-pointer",onClick:()=>toggleCol(col)},nome),
            ativo && React.createElement("span",{className:"text-[10px] bg-slate-100 rounded px-1.5 py-0.5"},`${idx+1}º`),
            ativo && React.createElement("button",{type:"button",onClick:()=>inverte(col),className:"text-[11px] border rounded px-2 py-0.5 font-semibold text-[#1e4a8a] bg-white w-[104px]"}, sortCols[idx].dir==="asc"?"↑ Crescente":"↓ Decrescente")
          );
        })
      ),
      React.createElement("div",{className:"p-2 border-t flex justify-between"},
        React.createElement("button",{type:"button",onClick:()=>setSortCols(ORD_PADRAO),className:"text-[11px] text-[#1e4a8a] font-semibold"},"Padrão (Data ↓)"),
        React.createElement("button",{type:"button",onClick:()=>setOpen(false),className:"text-[11px] font-semibold"},"Fechar")
      )
    )
  );
}

// ===== Descrição: lista suspensa com todos os termos da base + digitação livre =====
function ComboDescricao({value,onChange,options}){
  const E=React.createElement;
  const [open,setOpen]=useState(false);
  const [todos,setTodos]=useState(false);
  const ref=useRef(null);
  useFora(ref,()=>setOpen(false));
  const q=value.trim().toUpperCase();
  const vis=(todos||!q)?options:options.filter(o=>o.includes(q));
  return E("div",{ref,className:"relative"},
    E("div",{className:"flex"},
      E("input",{value,onFocus:()=>{setTodos(false);setOpen(true);},onChange:e=>{onChange(e.target.value.toUpperCase());setTodos(false);setOpen(true);},placeholder:"Selecione da lista ou digite um termo novo",autoComplete:"off",className:"flex-1 min-w-0 border rounded-l px-3 py-2.5 mt-1 text-[14px]"}),
      E("button",{type:"button",onClick:()=>{setTodos(true);setOpen(o=>!o);},className:"mt-1 border border-l-0 rounded-r px-3 bg-white text-[11px]",title:"Ver todas as descrições"},open?"▲":"▼")
    ),
    open && E("div",{className:"absolute z-40 left-0 right-0 mt-1 bg-white border rounded shadow-lg max-h-64 overflow-auto"},
      vis.length===0
        ? E("div",{className:"p-3 text-[12px] text-slate-500"},"Nenhum termo igual na lista. Ao cadastrar, você poderá incluí-lo como novo.")
        : vis.map(o=>E("div",{key:o,onClick:()=>{onChange(o);setOpen(false);},className:"px-3 py-2 text-[13px] hover:bg-slate-100 cursor-pointer"},o))
    )
  );
}

// ===== Estatísticas: janela gráfica com filtros pesquisáveis e comparativos =====
const E_CAMPOS=[["descricao","Descrição"],["viagem","Viagem"],["container","Container"],["status","Status"],["mes","Mês"],["dia","Dia da semana"],["tipo","Crédito/Débito"]];
const E_MED=[["saldo","Saldo"],["credito","Crédito"],["debitos","Débito"],["qtd","Quantidade"],["media","Média do CD"]];
const E_TIPOS=[["bar","Barras"],["stack","Barras empilhadas"],["hbar","Barras horizontais"],["line","Linhas"],["pie","Pizza"],["doughnut","Rosca"]];
const E_PAL=["#1e4a8a","#10b981","#f59e0b","#ef4444","#8b5cf6","#0ea5e9","#ec4899","#64748b","#84cc16","#f97316"];
const E_SEL="w-full border rounded px-2 py-1.5 text-[12px] bg-white";
function Estatisticas({dados,onClose}){
  const E=React.createElement;
  const [tipo,setTipo]=useState("bar"); const [med,setMed]=useState("saldo");
  const [grp,setGrp]=useState("mes"); const [cmp,setCmp]=useState("");
  const [f,setF]=useState({}); const [de,setDe]=useState(""); const [ate,setAte]=useState("");
  const cv=useRef(null); const chart=useRef(null);
  const pie=tipo==="pie"||tipo==="doughnut"; const hbar=tipo==="hbar";
  const kv=(x,k)=>String(x[k]??"").trim()||"(VAZIO)";

  // Base sempre derivada de "dados": toda inclusão atualiza listas, filtros e gráfico
  const base=useMemo(()=>dados.map(x=>({...x,tipo:(x.cd||0)<0?"DÉBITO":"CRÉDITO",dia:x.dia||diaSemana(x.data)})),[dados]);
  const opts=useMemo(()=>{
    const o={};
    E_CAMPOS.forEach(([k])=>{
      const u=[...new Set(base.map(x=>x[k]).filter(v=>String(v??"").trim()!==""))];
      if(k==="mes"){ const t=new Map(); base.forEach(x=>{ const d=new Date(x.data).getTime(); if(x.mes&&(!t.has(x.mes)||d<t.get(x.mes))) t.set(x.mes,d); }); u.sort((a,b)=>t.get(a)-t.get(b)); }
      else u.sort((a,b)=>String(a).localeCompare(String(b),"pt-BR"));
      o[k]=u.map(v=>({value:v,label:v}));
    });
    return o;
  },[base]);

  const R=useMemo(()=>base.filter(x=>
    E_CAMPOS.every(([k])=>!(f[k]&&f[k].length)||casa(f[k],x[k])) &&
    (!de||new Date(x.data)>=new Date(de)) && (!ate||new Date(x.data)<=new Date(ate+"T23:59:59"))
  ),[base,f,de,ate]);

  const calc=a=>med==="qtd"?a.length:med==="media"?(a.length?a.reduce((s,x)=>s+(x.cd||0),0)/a.length:0):a.reduce((s,x)=>s+(x[med]||0),0);
  const fmtV=v=>med==="qtd"?Math.round(v).toLocaleString("pt-BR"):fmtM(v);
  const ordenar=(k,arr)=>{ const ix=v=>{ const i=(opts[k]||[]).findIndex(o=>o.value===v); return i<0?9999:i; }; return arr.sort((a,b)=>ix(a)-ix(b)||a.localeCompare(b,"pt-BR")); };

  const resumo=useMemo(()=>{
    const labs=ordenar(grp,[...new Set(R.map(x=>kv(x,grp)))]);
    const sers=(pie||!cmp)?[null]:ordenar(cmp,[...new Set(R.map(x=>kv(x,cmp)))]);
    const linhas=labs.map(l=>R.filter(x=>kv(x,grp)===l));
    const ds=sers.map((s,i)=>({s,i,data:linhas.map(a=>calc(s===null?a:a.filter(x=>kv(x,cmp)===s)))}));
    return {labs,sers,ds,tot:linhas.map(a=>({v:calc(a),q:a.length}))};
  },[R,grp,cmp,med,pie,opts]);

  useEffect(()=>{
    if(chart.current){ chart.current.destroy(); chart.current=null; }
    if(!cv.current||typeof Chart==="undefined"||!R.length) return;
    const st=tipo==="stack"; const cor=i=>E_PAL[i%E_PAL.length];
    const datasets=pie
      ? [{data:resumo.ds[0].data.map(v=>Math.abs(v)),backgroundColor:resumo.labs.map((_,j)=>cor(j))}]
      : resumo.ds.map(d=>({label:d.s===null?(E_MED.find(m=>m[0]===med)||[])[1]:d.s,data:d.data,backgroundColor:cor(d.i),borderColor:cor(d.i),tension:.25,fill:false}));
    const vs={beginAtZero:true,stacked:st,ticks:{callback:v=>fmtV(v)}}; const cs={stacked:st};
    chart.current=new Chart(cv.current,{
      type:(tipo==="stack"||hbar)?"bar":tipo,
      data:{labels:resumo.labs,datasets},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:hbar?"y":"x",
        plugins:{legend:{display:pie||resumo.sers.length>1,position:pie?"right":"top"},
          tooltip:{callbacks:{label:c=>" "+(pie||!c.dataset.label?c.label:c.dataset.label)+": "+fmtV(pie?resumo.ds[0].data[c.dataIndex]:(hbar?c.parsed.x:c.parsed.y))}}},
        scales:pie?{}:(hbar?{x:vs,y:cs}:{x:cs,y:vs})}
    });
  },[resumo,tipo,R.length]);
  useEffect(()=>()=>{ if(chart.current) chart.current.destroy(); },[]);

  const lbl="text-[11px] font-bold uppercase text-slate-500";
  const sel=(rotulo,val,set,lista)=>E("div",null,E("label",{className:lbl},rotulo),E("select",{value:val,onChange:e=>set(e.target.value),className:E_SEL+" mt-1"},lista.map(([v,n])=>E("option",{key:v,value:v},n))));
  const nf=Object.values(f).filter(a=>a&&a.length).length+(de||ate?1:0);

  return E("div",{className:"fixed inset-0 z-50 bg-[#f1f5f9] flex flex-col",style:{height:"100dvh"}},
    E("div",{className:"flex items-center justify-between gap-3 px-4 py-3 border-b bg-white"},
      E("h2",{className:"font-bold text-[16px] text-slate-800"},"Estatísticas"),
      E("button",{onClick:onClose,className:BTN_AZUL+" !px-5"},"Fechar")
    ),
    E("div",{className:"flex-1 min-h-0 overflow-auto"},
    E("div",{className:"bg-white border-b px-4 py-3 flex flex-col gap-3 min-w-[640px]"},
      E("div",{className:"grid grid-cols-2 lg:grid-cols-4 gap-3"},
        sel("Tipo de gráfico",tipo,setTipo,E_TIPOS),
        sel("Medida",med,setMed,E_MED),
        sel("Agrupar por",grp,setGrp,E_CAMPOS),
        sel("Comparar por",cmp,setCmp,[["","Nenhum"],...E_CAMPOS])
      ),
      E("div",{className:"grid grid-cols-2 lg:grid-cols-5 gap-3"},
        ...E_CAMPOS.map(([k,n])=>E(MultiSelect,{key:k,label:n,options:opts[k]||[],value:f[k]||[],onChange:v=>setF(o=>({...o,[k]:v})),vazio:k!=="mes"&&k!=="tipo"})),
        E("div",{className:"flex gap-1"},E("input",{type:"date",value:de,onChange:e=>setDe(e.target.value),className:E_SEL}),E("input",{type:"date",value:ate,onChange:e=>setAte(e.target.value),className:E_SEL})),
        E("button",{type:"button",onClick:()=>{setF({});setDe("");setAte("");},className:BTN_AZUL+" !py-1.5"},`✕ Limpar filtros (${nf})`)
      )
    ),
    E("div",{className:"p-4 min-w-[640px]"},
      E("div",{className:"grid grid-cols-3 gap-3 mb-3"},
        E("div",{className:"bg-white rounded-lg border p-3"},E("div",{className:"text-[10px] font-bold text-slate-500 tracking-widest"},"RESULTADO"),E("div",{className:"text-[18px] font-bold text-[#1e4a8a]"},fmtV(calc(R)))),
        E("div",{className:"bg-white rounded-lg border p-3"},E("div",{className:"text-[10px] font-bold text-slate-500 tracking-widest"},"LANÇAMENTOS"),E("div",{className:"text-[18px] font-bold"},R.length)),
        E("div",{className:"bg-white rounded-lg border p-3"},E("div",{className:"text-[10px] font-bold text-slate-500 tracking-widest"},"GRUPOS"),E("div",{className:"text-[18px] font-bold"},resumo.labs.length))
      ),
      R.length===0
        ? E("div",{className:"bg-white rounded-lg border p-8 text-center text-slate-400"},"Nenhum lançamento com os filtros escolhidos. Limpe algum filtro.")
        : E("div",{className:"grid grid-cols-1 lg:grid-cols-3 gap-3"},
            E("div",{className:"lg:col-span-2 bg-white rounded-lg border p-3 relative",style:{height:"min(60vh,480px)"}},E("canvas",{ref:cv})),
            E("div",{className:"bg-white rounded-lg border p-3 overflow-auto",style:{maxHeight:"min(60vh,480px)"}},
              pie&&E("div",{className:"text-[10px] text-slate-500 mb-2"},"Pizza e rosca usam valores absolutos."),
              E("table",{className:"w-full text-[12px]"},
                E("thead",{className:"bg-slate-50 text-[10px] uppercase"},E("tr",null,["Grupo","Valor","Qtd"].map((h,i)=>E("th",{key:h,className:(i?"text-right":"text-left")+" p-2"},h)))),
                E("tbody",null,resumo.labs.map((l,i)=>E("tr",{key:l,className:"border-t"},E("td",{className:"p-2"},l),E("td",{className:"p-2 text-right font-bold"},fmtV(resumo.tot[i].v)),E("td",{className:"p-2 text-right"},resumo.tot[i].q))))
              )
            )
          )
    )
    )
  );
}

// Cole aqui a URL do seu Web App do Apps Script terminada em /exec
// (Implantar > Gerenciar implantações > copiar URL). Necessária para o
// APK (fora do domínio script.google.com) conseguir ler/gravar no Drive.
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxPXX8KwlajUHEcn8_KXnf6J_lIDHICFPkMYysEiOYapGTHyWS5yYK71T_sa8lBhnO9/exec";
const PENDENTES_KEY = KEY + "_pendentes";

function temGS(){ return !!(window.google && window.google.script && window.google.script.run); }
function temWebapp(){ return !!WEBAPP_URL && WEBAPP_URL.indexOf("http") === 0; }

function apiCarregar(){
  return new Promise((resolve,reject)=>{
    if (temGS()) {
      window.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).buscarUltimaVersao();
    } else if (temWebapp()) {
      fetch(WEBAPP_URL + "?action=buscarUltimaVersao")
        .then(r=>r.json()).then(resolve).catch(reject);
    } else {
      reject(new Error("Nenhum backend configurado (defina WEBAPP_URL)."));
    }
  });
}

function apiSalvar(json){
  return new Promise((resolve,reject)=>{
    if (temGS()) {
      window.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).salvarDados(json);
    } else if (temWebapp()) {
      fetch(WEBAPP_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"}, // evita preflight CORS
        body: JSON.stringify({action:"salvarDados", json: json})
      }).then(r=>r.json()).then(resolve).catch(reject);
    } else {
      reject(new Error("Nenhum backend configurado (defina WEBAPP_URL)."));
    }
  });
}

// Fila offline: tenta reenviar o último salvamento pendente quando a rede voltar.
function enfileirarPendente(json){ localStorage.setItem(PENDENTES_KEY, json); }
function limparPendente(){ localStorage.removeItem(PENDENTES_KEY); }
function tentarReenviarPendente(aviso){
  const p = localStorage.getItem(PENDENTES_KEY);
  if (!p) return;
  apiSalvar(p).then(r=>{
    if (r && r.status === "OK") { limparPendente(); aviso && aviso("🔄 Sincronizado com o Drive ("+r.qtd+" lançamentos)","ok"); }
  }).catch(()=>{ /* continua offline, tenta de novo na próxima oportunidade */ });
}
window.addEventListener("online", ()=>tentarReenviarPendente());

        )
      ),
      E("div",{className:"mt-4 bg-white rounded-lg border overflow-hidden"},
        E("div",{className:"overflow-auto max-h-[65vh]"},
          E("table",{className:"w-full border-collapse",style:{minWidth:"1000px"}},
            E("thead",null, E("tr",null, [
              ...COLS_ORD.map(([col,nome])=>{
                const i=sortCols.findIndex(s=>s.col===col);
                const seta=i>=0?(sortCols[i].dir==="asc"?" ↑":" ↓")+(sortCols.length>1?` ${i+1}`:""):"";
                return E("th",{key:col,className:"sheet-th sortable",onClick:()=>clickHeader(col),title:"Clique para ordenar"},nome+seta);
              }),
              E("th",{key:"acoes",className:"sheet-th"},"Ações")
            ])),
            E("tbody",null, pagDados.map(r=>E("tr",{key:r.id,className:"zebra"},
              celula(r,"descricao","sheet-td font-medium",r.descricao),
              celula(r,"parc","sheet-td font-medium",r.parc),
              celula(r,"viagem","sheet-td font-medium",r.viagem),
              celula(r,"container","sheet-td font-medium",r.container),
              celula(r,"data","sheet-td",fmtBR(r.data)),
              celula(r,"cd",`sheet-td font-bold ${r.cd>=0?"text-emerald-700":"text-rose-700"}`,fmtM(r.cd)),
              celula(r,"status","sheet-td",r.status),
              E("td",{className:"sheet-td"}, r.mes),
              E("td",{className:"sheet-td font-bold"}, fmtM(r.saldo)),
              E("td",{className:"sheet-td"}, E("button",{onClick:()=>{ if(!confirm("Excluir?")) return; setDados(d=>d.filter(x=>x.id!==r.id)); },className:"text-rose-600 text-[11px]"},"Excluir"))
            )))
          )
        ),
        pagDados.length===0 && E("div",{className:"p-8 text-center text-slate-400"}, "Nenhum lançamento. Use Upload JSON ou Importar CSV."),
        E("div",{className:"flex items-center justify-between p-3 border-t bg-slate-50"},
          E("span",{className:"text-[11px]"}, `${pagDados.length} linhas`),
          E("div",{className:"flex gap-1"},
            E("button",{disabled:pagina<=1,onClick:()=>setPagina(p=>Math.max(1,p-1)),className:"px-3 py-1 rounded border bg-white disabled:opacity-40 text-[12px]"},"‹ Anterior"),
            E("span",{className:"text-[11px] px-2"}, `${pagina}/${totalPag}`),
            E("button",{disabled:pagina>=totalPag,onClick:()=>setPagina(p=>Math.min(totalPag,p+1)),className:"px-3 py-1 rounded border bg-white disabled:opacity-40 text-[12px]"},"Próxima ›")
          )
        )
      )
    ),
    // Novo Lançamento: tela cheia (celular e desktop), só "Fechar" no topo; Fechar salva antes de encerrar
    showNovo && E("div",{className:"fixed inset-0 z-50 bg-white flex flex-col",style:{height:"100dvh"}},
      E("div",{className:"flex items-center justify-between gap-3 px-4 py-3 border-b bg-white"},
        E("h2",{className:"font-bold text-[16px] text-slate-800"},"Novo Lançamento"),
        E("button",{onClick:fecharNovo,className:BTN_AZUL+" !px-5"},"Fechar")
      ),
      E("div",{className:"flex-1 overflow-auto"},
        E("div",{className:"max-w-[900px] mx-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-4"},
          E("div",{className:"md:col-span-2"}, E("label",{className:campoLbl},"Descrição"), E(ComboDescricao,{value:novo.descricao,onChange:v=>setNovo(n=>({...n,descricao:v})),options:listas.descStr})),
          E("div",null, E("label",{className:campoLbl},"Total parcelas"), E("input",{type:"number",value:novo.totalParc,onChange:e=>setNovo({...novo,totalParc:e.target.value}),className:campoIn})),
          E("div",null, E("label",{className:campoLbl},"Container"), E("input",{value:novo.container,onChange:e=>setNovo({...novo,container:e.target.value.toUpperCase()}),className:campoIn})),
          E("div",null, E("label",{className:campoLbl},"Data"), E("input",{type:"date",value:novo.data,onChange:e=>setNovo({...novo,data:e.target.value}),className:campoIn})),
          E("div",null, E("label",{className:campoLbl},"Valor CD"), E("input",{value:novo.cd,onChange:e=>setNovo({...novo,cd:e.target.value}),placeholder:"-24 ou 1500",className:campoIn})),
          E("div",null, E("label",{className:campoLbl},"Status"), E("select",{value:novo.status,onChange:e=>setNovo({...novo,status:e.target.value}),className:campoIn}, ["PAGO D","PAGO C","PENDENTE",""].map(s=>E("option",{key:s,value:s},s||"(VAZIO)")))),
          E("div",null, E("label",{className:campoLbl},"Viagem"), E("select",{value:novo.viagem,onChange:e=>setNovo({...novo,viagem:e.target.value}),className:campoIn}, (listas.dViagem.some(o=>o.value===novo.viagem)?listas.dViagem:[...listas.dViagem,{value:novo.viagem,label:novo.viagem}]).map(o=>E("option",{key:o.value,value:o.value},o.label)))),
          E("div",{className:"md:col-span-2 pt-2"}, E("button",{onClick:adicionar,className:BTN_AZUL+" w-full !py-3 !text-[14px]"},"Cadastrar"))
        )
      )
    )
  );
}
createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
